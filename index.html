<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assitente de estudo IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <h1 class="font-medium text-xl w-full text-center">Assistente de estudo IA</h1>
    
    
    <div class="max-w-3xl w-full mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl text-left">
        <label class="block text-sm font-medium text-slate-300 mb-2" for="texto-materia">Texto da Matéria ou Notas de Aula:</label>
        <textarea id="texto-materia" rows="6" class="w-full bg-slate-900 border border-slate-950 rounded-xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Digite aqui o conteúdo que você deseja estudar..."></textarea>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4" >
        <button id="gerar-resumo" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95">
    <!-- Novo visual do botão estilizado -->
    <span id="txt-botao">Gerar Resumo</span>
</button>
           <!--Botão 2 para gerar o quiz -->
<button id="gerar-quiz" class=" mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl transition-all duration-300 flex items-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95">
    <span id="txt-botao">Gerar Simulado (Quiz)</span>
</button>
        </div>
    </div>
        <div id="resumo-container" class="max-w-3xl w-full mt-6 bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl text-left hidden">
        <h2 class="text-xl font-bold text-indigo-400 mb-4">✨ Seu Material Gerado</h2>
        
        <!-- Caixa 1-->
        <div id="resultado-ia" class="text-slate-300 whitespace-pre-line mb-6"></div>
        <!-- 🔍 SEÇÃO DE PERGUNTAS SUGERIDAS (Fica oculta até a IA responder) -->
        <div id="container-sugestoes" class="mt-4 pt-4 border-t border-slate-800 hidden">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">💡 Sugestões de aprofundamento:</p>
        <div id="lista-sugestoes" class="flex flex-col gap-2">
    </div>
</div>


        <!--ÁREA DO CRONOGRAMA OCULTO -->
        <div class="border-t border-slate-800 pt-4">
            <!-- Botão de Expandir/Recolher -->
            <button id="btn-ver-cronograma" class="flex items-center gap-2 text-indigo-400 hover:text-indigo-300 font-semibold focus:outline-none">
                <span>Ver cronograma de Estudos</span>
                <span id="seta-cronograma">🔽</span>
            </button>
            
            <!-- Caixa 2: O conteúdo do cronograma-->
            <div id="conteudo-cronograma" class="mt-4 text-slate-300 whitespace-pre-line hidden">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
